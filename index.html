<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/Logo.svg" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Special+Gothic+Condensed+One&display=swap"
			rel="stylesheet"
		/>

		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Portfolio</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>

		<script>
			// Function to toggle title
			const originalTitle = "My Portfolio";
			const newTitle = "By Christopher Lazaga";

			let isOriginalTitle = true;

			const toggleTitle = () => {
				document.title = isOriginalTitle ? newTitle : originalTitle;
				isOriginalTitle = !isOriginalTitle;
			};

			// Run the title swap every 2 seconds (2000 ms)
			setInterval(toggleTitle, 2000);
		</script>
	</body>
</html>
